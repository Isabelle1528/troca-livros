<!DOCTYPE html>
<html lang="en">

<body>
    <main>
        <section class=sessao-imagem>
            <img src="tela-login.png" alt="Casal em uma livraria">
        </section>

        <section class=sessao-login>
            <div class="area-titulo">
                <h3><span>ConnectBook</span></h3>

            </div>
            <form action="#" method="post">
                <label for="e-mail">Usuário ou E-mail</label>
                <input type="text" id="e-mail" placeholder="Usuario ou E-mail"> 


                <label for="senha"> Senha </label>
                <input type="password" id="senha" placeholder="Informe sua Senha"> 

                <div class="links-senha">
                    <input type="checkbox" id="">
                    <label for="Lembrar-senha"> Lembrar senha</label>

                    <a href="#" id="link-squeceu-senha">Esqueci a senha?</a>
                </div>

                <button> Acessar </button>
                <a href="cadastro.html">Ainda não possuo uma conta </a>

            </form>


        </section>


    </main>
